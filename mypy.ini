[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
warn_redundant_casts = True
show_error_codes = True
exclude = (^\.venv/|^\.mypy_cache/|/\._)

[mypy-requests]
ignore_missing_imports = True

[mypy-telegram.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True
